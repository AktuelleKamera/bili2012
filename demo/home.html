<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BiliClassic Web - Bilibili 2012 Flash 播放器</title>
<link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
<style>
  body {
    margin: 0;
    padding: 30px 15px;
    background: #222;
    color: #f2f2f2;
    font: 14px/1.7 "Microsoft YaHei", "SimSun", Arial, sans-serif;
  }
  .box {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px;
    background: #333;
    border: 1px solid #555;
    border-radius: 8px;
  }
  h1 {
    margin: 0 0 2px;
    font-size: 22px;
    color: #00a1d6;
  }
  .subtitle {
    margin: 0 0 16px;
    color: #aaa;
    font-size: 12px;
  }
  p { margin: 8px 0; }
  input {
    width: 360px;
    max-width: 70%;
    height: 32px;
    padding: 0 8px;
    border: 1px solid #777;
    background: #fff;
    color: #222;
    font-size: 14px;
  }
  button {
    height: 34px;
    margin-left: 4px;
    padding: 0 14px;
    border: 0;
    border-radius: 4px;
    background: #00a1d6;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  button.alt { background: #666; }
  a { color: #6ccff6; }
  .hint { color: #aaa; font-size: 12px; }
  .msg { color: #ff8e8e; }
  .links { margin-top: 16px; padding-top: 12px; border-top: 1px solid #555; }
  code { color: #ffd479; }
</style>
</head>
<body>
<div class="box">
  <h1>BiliClassic Web</h1>
  <p class="subtitle">Bilibili 2012 Flash 播放器</p>
  <p>输入 AV 号、BV 号或 B站视频地址：</p>
  <p>
    <input id="target" value="" placeholder="av116895554473263 或 BV19FNn6hEU5" onkeydown="if (event.keyCode === 13) go();">
    <button onclick="go()">打开 2012 页面</button>
    <button class="alt" onclick="goRuffle()">Ruffle 模式</button>
  </p>
  <p id="msg" class="msg"></p>
  <p class="hint">
    视频播放需要 Chrome 42 + Flash。现代浏览器可用 Ruffle 模式查看界面，但视频可能无法播放。
  </p>
  <div class="links">
    <p>示例：</p>
    <p><a href="/">进入 2012 首页</a>　<a href="/av116895554473263">/av116895554473263</a>　<a href="/av385609">/av385609</a>　<a href="/player">直接播放器 /player</a></p>
    <p class="hint">
      2012 页面地址格式：<code>/av&lt;数字&gt;</code> 或 <code>/bv/&lt;BV号&gt;</code>；多 P 用 <code>?p=2</code>。
    </p>
  </div>
</div>
<script>
function extractTarget(value) {
  value = (value || "").replace(/^\s+|\s+$/g, "");
  if (!value) return "";
  var bv = value.match(/(BV[0-9A-Za-z]+)/);
  if (bv) return "/bv/" + bv[1];
  var av = value.match(/(?:^|\/|av)(\d+)/i);
  if (av) return "/av" + av[1];
  return "";
}

function go() {
  var target = extractTarget(document.getElementById("target").value);
  if (!target) {
    document.getElementById("msg").innerHTML = "请输入 av号、BV号或 B站视频链接。";
    return;
  }
  window.location.href = target;
}

function goRuffle() {
  var target = extractTarget(document.getElementById("target").value);
  if (!target) {
    document.getElementById("msg").innerHTML = "请输入 av号、BV号或 B站视频链接。";
    return;
  }
  window.location.href = target + (target.indexOf("?") >= 0 ? "&" : "?") + "ruffle=1";
}
</script>
</body>
</html>
